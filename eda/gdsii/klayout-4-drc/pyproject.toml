[project]
name = "klayout-4-drc"
version = "0.1.0"
description = "Programmatic KLayout DRC and DeepSeek Harness Flow Integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "klayout==0.30.8",
    "pyyaml>=6.0.3",
    "Pillow>=11.0",
    "reportlab>=4.0",
    "pypdf>=5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
klayout-drc = "klayout_drc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klayout_drc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

markers = ["integration_sandbox: requires working Bubblewrap user namespaces"]
