[project]
name = "archdoc2modules"
version = "0.1.0"
description = "Two-stage pipeline for converting PDF specifications into modular architecture documentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
archdoc2modules = "cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
