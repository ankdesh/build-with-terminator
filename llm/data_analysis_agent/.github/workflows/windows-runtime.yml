name: Windows offline runtime
on:
  workflow_dispatch:
  push:
    paths: ['pipeline_core/**', 'backend/**', 'tests/**', 'examples/**', 'pyproject.toml', 'offline_app.py', 'runtime_launcher.py', 'frontend/**', 'requirements-runtime.txt', 'scripts/**', '.github/workflows/windows-runtime.yml']
  pull_request:
    paths: ['pipeline_core/**', 'backend/**', 'tests/**', 'examples/**', 'pyproject.toml', 'offline_app.py', 'runtime_launcher.py', 'frontend/**', 'requirements-runtime.txt', 'scripts/**', '.github/workflows/windows-runtime.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m pip install -e '.[dev,packaging]'
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: python -m pytest tests/test_pipeline_engine.py tests/test_projects.py tests/test_project_agent.py tests/test_offline_app.py -q
      - run: python scripts/build_windows_runtime.py
      - run: python scripts/windows_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-runtime
          path: dist/windows-x64.zip
