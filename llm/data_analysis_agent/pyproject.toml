[project]
name = "wps-ai"
version = "0.2.0"
description = "Chat-built analysis pipelines with a model-free Windows dashboard runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "statsmodels>=0.14.2",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "openai>=1.40.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.11.0",
    "pandas-stubs>=2.2.0",
]
packaging = ["pyinstaller>=6.10.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "launcher", "runtime_launcher", "offline_app"]

[tool.setuptools.packages.find]
include = ["backend*", "pipeline_core*", "examples*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
