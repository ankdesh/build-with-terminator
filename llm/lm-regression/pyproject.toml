[project]
name = "lm-regression"
version = "0.1.0"
description = "Non-LM experimental validation of the Code-Regression dataset"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "tiktoken>=0.7",
    "huggingface-hub>=0.20",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "tqdm>=4.0",
    "nbformat>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
